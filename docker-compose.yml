services:
  sensor-db:
    image: influxdb:3-core
    restart: unless-stopped
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --without-auth # local dev only
    volumes:
      - ./influxdb3/core/data:/var/lib/influxdb3/data
      - ./influxdb3/core/plugins:/var/lib/influxdb3/plugins

  backend:
    build: ./web/backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      SERVER_LISTEN: ":8000"
      SERVER_DATABASE_URL: ${SERVER_DATABASE_URL:-}
      SERVER_LOG_LEVEL: ${SERVER_LOG_LEVEL:-info}
      SERVER_ENVIRONMENT: ${SERVER_ENVIRONMENT:-dev}
      INFLUX_URL: ${INFLUX_URL:-http://sensor-db:8181}
      INFLUX_TOKEN: ${INFLUX_TOKEN:-}
      INFLUX_ORG: ${INFLUX_ORG:-gimbal-org}
      INFLUX_BUCKET: ${INFLUX_BUCKET:-gimbal}
      MQTT_BROKER: ${MQTT_BROKER:-tcp://mqtt-broker:1883}
      SERVER_JWT_SECRET: ${SERVER_JWT_SECRET:-}
      SERVER_ACCESS_TTL: ${SERVER_ACCESS_TTL:-15m}
      SERVER_REFRESH_TTL: ${SERVER_REFRESH_TTL:-168h}
      NAVY_AGENT_URL: ${NAVY_AGENT_URL:-}
      NAVY_AGENT_MODEL: ${NAVY_AGENT_MODEL:-}
      NAVY_AGENT_API_KEY: ${NAVY_AGENT_API_KEY:-}

  frontend:
    build: ./web/frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # opt-in: docker compose --profile tracker up --build
  tracker:
    build: ./tracker
    profiles: [tracker]
    restart: unless-stopped
    depends_on: [mqtt-broker]
    environment:
      SOURCE: ${TRACKER_SOURCE:-http://127.0.0.1:81/stream}
      MQTT_HOST: mqtt-broker
      MQTT_TOPIC: ${TRACKER_MQTT_TOPIC:-gimbal/target}
    # Linux + local USB webcam: set TRACKER_SOURCE=/dev/video0 and uncomment
    # devices: ["/dev/video0:/dev/video0"]

  mqtt-broker:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - 1883:1883
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
